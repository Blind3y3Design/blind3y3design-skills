name: Sync upstream skills

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays, 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy skills from their creators' repos
        env:
          SYNC_SUMMARY: ${{ runner.temp }}/sync-summary.md
        run: bash scripts/sync-upstream.sh

      - name: Write PR body
        run: |
          {
            echo "Upstream skills changed since the last sync. These folders are direct copies, so review the upstream diff before merging: once merged, \`npx skills update\` delivers it to every repo that installed these skills."
            echo
            cat "$RUNNER_TEMP/sync-summary.md"
          } > "$RUNNER_TEMP/pr-body.md"

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: sync-upstream-skills
          delete-branch: true
          commit-message: Sync upstream skills
          title: Sync upstream skills
          body-path: ${{ runner.temp }}/pr-body.md
